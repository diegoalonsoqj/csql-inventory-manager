services:
  postgres:
    image: postgres:16-alpine
    container_name: csql_inventory_pg
    environment:
      POSTGRES_USER: csqlim
      POSTGRES_PASSWORD: csqlim_dev
      POSTGRES_DB: csql_inventory
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csqlim -d csql_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
